# Server
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:bid_management}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:604800000}

# AI — Groq API
app.gemini.api-key=${GROQ_API_KEY}
app.gemini.model=${GROQ_MODEL:llama-3.1-8b-instant}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID}
app.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Frontend URL
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Email / OTP (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.bidflow=DEBUG
logging.level.org.springframework.security=WARN

# Max request size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
